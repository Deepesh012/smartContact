<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:replace="normal/base2::Layout(~{::section})">
<head>
<meta charset="UTF-8" />
<title>This is User-Dashboard Page</title>
</head>
<body>

	<section>
		<div class="card mr-3 ml-3">
			<div class="card-body">
				<h1 class="text-center">
					<i class="fa-solid fa-user-plus"></i> Update your Contact
				</h1>
				<div class="container-fluid mt-1">
					<div class="row">
						<div class="col-md-8 offset-md-2">
							<form action="#" th:object="${contact}"
								enctype="multipart/form-data" method="post"
								th:action="@{/user/process-update}" class="mt-2">

								<!-- First Name -->
								
								<input type="hidden" th:value="${contact.cId}" name="cId">
								
								<div class="input-group">
									<div class="input-group-prepend">
										<div class="input-group-text">
											<i class="fa fa-plus"></i>
										</div>
									</div>

									<input th:value="${contact.name}" required="required" type="text" id="firstName"
										name="name" placeholder="Enter Name here.."
										class="form-control" />

								</div>
								<!-- Second Name -->
								<div class="input-group mt-3">
									<div class="input-group-prepend">
										<div class="input-group-text">
											<i class="fas fa-user-alt"></i>
										</div>
									</div>

									<input th:value="${contact.secondName}" required="required" type="text" id="SecondName"
										name="secondName" placeholder="Enter Second Name here.."
										class="form-control" />

								</div>
								<!-- Phone Field -->
								<div class="input-group mt-3">
									<div class="input-group-prepend">
										<div class="input-group-text">
											<i class="fas fa-phone"></i>
										</div>
									</div>

									<input th:value="${contact.phone}" required="required" min="10" type="number" id="phone"
										name="phone" placeholder="Enter Phone Number here.."
										class="form-control" />
								</div>

								<!-- Email Field -->
								<div class="input-group mt-3">
									<div class="input-group-prepend">
										<div class="input-group-text">@</div>
									</div>

									<input th:value="${contact.email}" required="required" type="email" id="email" name="email"
										placeholder="Enter Email here.." class="form-control" />
								</div>

								<!-- Work field -->
								<div class="input-group mt-3">
									<div class="input-group-prepend">
										<div class="input-group-text">
											<i class="fa fa-briefcase"></i>
										</div>
									</div>

									<input th:value="${contact.work}" required="required" type="text" id="work" name="work"
										placeholder="Enter Work here.." class="form-control" />
								</div>

								<!-- Contact Description -->
								<div class="form-group mt-3">
									<textarea th:text="${contact.description}" placeholder="Enter contact description"
										name="description" id="mytextarea" class="form-control"
										rows="10"></textarea>
								</div>

								<!-- Contact Image -->
								
								<div class="container text-center">
									<img style="width: 250px; height: 250px" class="img-fluid my_profile_picture" th:src="@{'/img/'+${contact.image}}" alt="" />
								</div>
								
								<p>Choose new profile Image</p>
								
								<div class="custom-file">
									<input type="file" name="profileImage" />
								</div>

								<div class="container text-center">
									<button class="btn btn-outline-primary">Save Contact</button>
								</div>

							</form>
						</div>
					</div>
				</div>
			</div>
		</div>
		
		<script src="https://cdn.tiny.cloud/1/vykpicfv2otgt4e1hmozcy7fbpmjr129hnr7d4fvgwsbh9pe/tinymce/7/tinymce.min.js" referrerpolicy="origin"></script>

<!-- Place the following <script> and <textarea> tags your HTML's <body> -->
<script>
  tinymce.init({
    selector: 'textarea' });
</script>
	</section>

</body>
</html>
