<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Send Email</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background: #fff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0px 4px 12px rgba(0,0,0,0.1);
      width: 400px;
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }
    input, textarea, button {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
    }
    button {
      background: #007bff;
      color: white;
      border: none;
      cursor: pointer;
      transition: 0.3s ease;
    }
    button:hover {
      background: #0056b3;
    }
    .message {
      margin-top: 10px;
      text-align: center;
      font-weight: bold;
    }
    .success {
      color: green;
    }
    .error {
      color: red;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Send Email</h2>
    <form id="mailForm">
  <input type="email" id="to" placeholder="Recipient Email" required>
  <input type="text" id="subject" placeholder="Subject" required>
  <textarea id="message" placeholder="Message" rows="5" required></textarea>
  <button type="submit">Send Mail</button>
</form>

    <div id="responseMessage" class="message"></div>
  </div>

  <script>
    document.getElementById("mailForm").addEventListener("submit", async (e) => {
  e.preventDefault(); // stop default GET request

  const emailData = {
    to: document.getElementById("to").value,
    subject: document.getElementById("subject").value,
    message: document.getElementById("message").value,
  };

  try {
    const response = await fetch("http://localhost:8289/sendemail", {
      method: "POST",   // 👈 important
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(emailData),
    });

    const result = await response.text();
    alert(result);
  } catch (error) {
    alert("Error sending email!");
  }
});

     
  </script>
</body>
</html>
