<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:replace="normal/base2::Layout(~{::section})">
<head>
<meta charset="UTF-8" />
<title>This is User-Dashboard Page</title>
</head>
<body>

	<section>

		<div class="card mr-3 ml-3 mb-3 " th:if=${contact}>
			<div class="card-body">
				<div class="container text-center">
					<img style="height: 200px; width: 200px;"
						th:src="@{'/img/'+${contact.image}}" class="my_profile_picture"
						src="" alt="profile-photo" />
					<h3 class="mt-3">
						<span th:text="${contact.name}"></span> 
						<span th:text="${contact.secondName}"></span>
					</h3>

					<table class="table">
						<thead>
							<tr>
								<th scope="col">#ID</th>
								<th scope="col">SCMUSR<span th:text="${contact.cId}"></span></th>

							</tr>
						</thead>
						<tbody>
							<tr>
								<th scope="row">Email</th>
								<td><span th:text="${contact.email}"></span></td>

							</tr>

							<tr>
								<th scope="row">Phone</th>
								<td><span th:text="${contact.phone}"></span></td>

							</tr>

							<tr>
								<th scope="row">Work</th>
								<td><span th:text="${contact.work}"></span></td>

							</tr>

						</tbody>


					</table>


					<div class="description">
						<th:block th:utext="${contact.description}"></th:block>
					</div>

					<div class="mt-3">
						<a href="#" th:onclick="|deleteContact(${contact.cId})|" class="btn btn-block btn-danger btn-sm">
									<i class="fa-solid fa-trash"></i>
								</a>
								
								<form method="post" th:action="@{'/user/update-contact/'+${contact.cId}}" class="mt-2"><button type="submit" class="btn btn-block btn-primary btn-sm" >
									<i class="fa-solid fa-pen-to-square"></i>
								</button>
								</form>
					</div>

				</div>
			</div>


		</div>

		<h1 class="text-center p-3 bg-danger text-white"
			th:unless="${contact}">You Don't have permission to see other
			contacts..!</h1>


	</section>

</body>
</html>
