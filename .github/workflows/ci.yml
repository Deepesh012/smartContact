
name: SmartContact CI Workflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: smartcontact
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres -d smartcontact"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Test and Build Application
        env:
          TEST_DB_URL: jdbc:postgresql://localhost:5432/smartcontact
          TEST_DB_USERNAME: postgres
          TEST_DB_PASSWORD: postgres
        run: mvn clean package

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ghcr.io/deepesh012/smartcontact:latest .

      - name: Push Docker Image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push ghcr.io/deepesh012/smartcontact:latest

      - name: Deploy to EC2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@v1.2.0
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DB_URL,DB_USERNAME,DB_PASSWORD,MAIL_USERNAME,MAIL_PASSWORD
          script: |
            set -e

            echo "Pulling latest Docker image"
            docker pull ghcr.io/deepesh012/smartcontact:latest

            echo "Stopping old application"
            docker stop smartcontact-app || true

            echo "Removing old application"
            docker rm smartcontact-app || true

            echo "Starting new application"
            docker run -d \
              --name smartcontact-app \
              --restart unless-stopped \
              --network smartcontact-network \
              -p 8000:8289 \
              -e DB_URL="$DB_URL" \
              -e DB_USERNAME="$DB_USERNAME" \
              -e DB_PASSWORD="$DB_PASSWORD" \
              -e MAIL_USERNAME="$MAIL_USERNAME" \
              -e MAIL_PASSWORD="$MAIL_PASSWORD" \
              ghcr.io/deepesh012/smartcontact:latest

            echo "Waiting for application startup"
            sleep 20

            echo "Checking application container"
            docker ps --filter "name=smartcontact-app"

            echo "Checking application health"
            curl -f --retry 10 --retry-delay 5 --retry-connrefused \
              http://localhost:8000/actuator/health

            echo ""
            echo "Deployment completed successfully"
