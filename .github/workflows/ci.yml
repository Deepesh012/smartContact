name: SmartContact CI Workflow

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
            
permissions:
    contents: read
    packages: write

jobs:
    build:
        runs-on: ubuntu-latest
        
        services:
            postgres:
                image: postgres:17
                env:
                    POSTGRES_DB: smartcontact
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                ports:
                    - "5432:5432"
                options: >-
                    --health-cmd "pg_isready -U postgres -d smartcontact"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            - name: Setup Java 17
              uses: actions/setup-java@v4
              with:
                java-version: '17'
                distribution: 'temurin'
                cache: maven
            - name: Run Test and Build Application
              env: 
                TEST_DB_URL: jdbc:postgresql://localhost:5432/smartcontact
                TEST_DB_USERNAME: postgres
                TEST_DB_PASSWORD: postgres
              run: mvn clean package
            - name: Login to Github Container Registry
              uses: docker/login-action@v3
              with:
                registry: ghcr.io
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }}
            - name: Build Docker image
              run: docker build -t ghcr.io/deepesh012/smartcontact:latest .
            - name: Push Docker Image to ghcr
              run: docker push ghcr.io/deepesh012/smartcontact:latest